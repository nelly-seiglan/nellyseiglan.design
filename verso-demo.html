<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VERSO — Motion demo</title>
<style>
:root{--purple:#6237F0;--bg:#EDECEF;
  --f-home:url(assets/verso-home.png);
  --f-report:url(assets/verso-report.jpg);
  --f-finding:url(assets/verso-findings.jpg);
  --f-interview:url(assets/verso-studies.jpg);
  --f-interviews:url(assets/verso-chat.jpg);
  --f-chatEmpty:url(assets/verso-chat-welcome.jpg);
  --f-chatFull:url(assets/verso-chat.jpg);
  --f-iList:url(assets/verso-interviews.png);
  --f-iDetail:url(assets/verso-interview.png);
  --f-chatAI:url(assets/verso-chatai.png);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;
  background:radial-gradient(1200px 700px at 15% -10%,#f3f0ff 0,transparent 55%),
             radial-gradient(1100px 800px at 110% 120%,#eef3ff 0,transparent 50%),#EDECEF;}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1840px;height:1006px;flex:0 0 auto;transform-origin:center center;
  border-radius:20px;overflow:hidden;background:#FAFAFA;
  box-shadow:0 40px 120px -30px rgba(30,24,60,.28),0 0 0 1px rgba(255,255,255,.6)}
.frame{position:absolute;inset:0;opacity:0;visibility:hidden;transform:scale(1.05);transition:opacity .8s cubic-bezier(.4,0,.15,1),visibility .8s,transform 1.6s cubic-bezier(.22,1,.36,1);z-index:1;
  background-repeat:no-repeat;background-position:center;background-size:contain;background-color:#FAFAFA;will-change:opacity,transform}
.frame.active{opacity:1;visibility:visible;transform:scale(1);z-index:2}
.frame.exiting{opacity:0;visibility:visible;transform:scale(.985);z-index:1;transition:opacity .6s ease,transform 1.1s cubic-bezier(.22,1,.36,1)}
.frame[data-key="home"]{background-image:var(--f-home);background-size:cover;background-position:top center}
.frame[data-key="report"]{background-image:var(--f-report);background-position:top center}
.frame[data-key="finding"]{background-image:var(--f-finding)}
.frame[data-key="interview"]{background-image:var(--f-interview)}
.frame[data-key="interviews"]{background-image:var(--f-interviews)}
.frame[data-key="chatEmpty"]{background-image:var(--f-chatEmpty)}
.frame[data-key="chatFull"]{background-image:var(--f-chatFull)}
.frame[data-key="iList"]{background-image:var(--f-iList);background-size:cover;background-position:top center}
.frame[data-key="iDetail"]{background-image:var(--f-iDetail);background-size:contain;background-position:center}
.frame[data-key="chatAI"]{background-image:var(--f-chatAI);background-size:cover;background-position:top center}

#cursor{position:absolute;left:0;top:0;z-index:40;pointer-events:none;opacity:0;
  transition:left .9s cubic-bezier(.45,.05,.2,1),top .9s cubic-bezier(.45,.05,.2,1),opacity .35s;
  filter:drop-shadow(0 4px 7px rgba(20,16,40,.4))}
#cursor.show{opacity:1}
#cursor .arw{width:34px;height:34px;display:block}
#cursor .rip{position:absolute;left:6px;top:5px;width:18px;height:18px;border-radius:50%;
  background:rgba(98,55,240,.5);transform:scale(0);opacity:0}
#cursor.click .rip{animation:rip .55s ease-out}
@keyframes rip{0%{transform:scale(0);opacity:.75}100%{transform:scale(5);opacity:0}}
#cursor.press .arw{transform:scale(.82);transition:transform .12s}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div class="frame" data-key="home"></div>
  <div class="frame" data-key="report"></div>
  <div class="frame" data-key="finding"></div>
  <div class="frame" data-key="interview"></div>
  <div class="frame" data-key="interviews"></div>
  <div class="frame" data-key="chatEmpty"></div>
  <div class="frame" data-key="chatFull"></div>
  <div class="frame" data-key="iList"></div>
  <div class="frame" data-key="iDetail"></div>
  <div class="frame" data-key="chatAI"></div>
</div></div>

<script>
var stage=document.getElementById('stage');
function fit(){
  var pad=0, vw=window.innerWidth-pad, vh=window.innerHeight-pad;
  var s=Math.min(vw/1840, vh/1006);
  if(!isFinite(s)||s<=0) s=0.2;
  stage.style.transform='scale('+Math.max(0.1,s)+')';
}
window.addEventListener('resize',fit); fit();

var frames={};
document.querySelectorAll('.frame').forEach(function(f){frames[f.dataset.key]=f});
var STEPS=[
  {key:'home'},{key:'report'},{key:'finding'},
  {key:'iDetail'},{key:'iList'},{key:'chatAI'},{key:'chatFull'}
];
var idx=0, playing=false, token=0, current=null;
function show(key){
  Object.keys(frames).forEach(function(k){
    var f=frames[k];
    if(k===key){ f.classList.remove('exiting'); f.classList.add('active'); }
    else if(f.classList.contains('active')){ f.classList.remove('active'); f.classList.add('exiting'); }
    else { f.classList.remove('active','exiting'); }
  });
  current=key;
}
function goTo(i){ i=Math.max(0,Math.min(STEPS.length-1,i)); idx=i; show(STEPS[i].key); }

var cursor=document.createElement('div');
cursor.id='cursor';
cursor.innerHTML='<svg class="arw" viewBox="0 0 24 24" fill="#fff" stroke="#241d47" stroke-width="1.3" stroke-linejoin="round"><path d="M5 3l14.5 8.6-6.3 1.4L9.6 20 5 3z"/></svg><span class="rip"></span>';
stage.appendChild(cursor);
function moveCursor(x,y){cursor.style.left=x+'px';cursor.style.top=y+'px';}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)});}
async function clickAt(x,y,hold){
  moveCursor(x,y);
  await sleep(950);
  cursor.classList.add('click','press');
  await sleep(150); cursor.classList.remove('press');
  setTimeout(function(){cursor.classList.remove('click')},550);
  await sleep(hold||420);
}

async function tour(){
  var my=++token; playing=true;
  cursor.classList.add('show');
  var A=function(){return my===token && playing};
  while(A()){
    goTo(0); moveCursor(300,250);
    await sleep(1300); if(!A())break;
    await clickAt(560,525); if(!A())break;   /* home -> report */

    goTo(1);
    await sleep(2200); if(!A())break;
    await clickAt(620,430); if(!A())break;   /* report -> finding */

    goTo(2);
    await sleep(2000); if(!A())break;
    await clickAt(600,352); if(!A())break;   /* finding -> interview detail */

    goTo(3);
    await sleep(3000); if(!A())break;
    await clickAt(70,40); if(!A())break;     /* interview detail -> interviews list */

    goTo(4);
    await sleep(2400); if(!A())break;
    await clickAt(120,380); if(!A())break;   /* interviews list -> chat page */

    goTo(5);
    await sleep(3000); if(!A())break;
    await clickAt(660,300); if(!A())break;   /* chat page -> chat detail */

    goTo(6);
    cursor.classList.remove('show');
    await sleep(4200); if(!A())break;
    cursor.classList.add('show');
  }
}

goTo(0);
if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ }
else { tour(); }
</script>
</body>
</html>
