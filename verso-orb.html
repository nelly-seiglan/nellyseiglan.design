<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orb</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --idle-1: #c4baed; --idle-2: #9f8fe0; --idle-3: #d4c8f7;
    --listen-1: #a78bfa; --listen-2: #6d28d9; --listen-3: #c4b5fd;
    --transition: 800ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  html,body{height:100%}
  body {
    font-family: 'DM Sans', sans-serif;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .scene { position: relative; width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; }
  .halo {
    position: absolute; inset: -30px; border-radius: 50%;
    background: radial-gradient(circle, var(--idle-1) 0%, transparent 70%);
    opacity: 0.35; filter: blur(24px);
    animation: haloIdle 4s ease-in-out infinite;
    transition: background var(--transition), opacity var(--transition);
  }
  @keyframes haloIdle { 0%,100%{transform:scale(1);opacity:.30}50%{transform:scale(1.12);opacity:.45} }
  .orb {
    position: relative; width: 180px; height: 180px;
    border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
    background: radial-gradient(circle at 38% 36%, var(--idle-3) 0%, var(--idle-1) 40%, var(--idle-2) 100%);
    box-shadow: 0 0 40px rgba(167,139,250,0.25), 0 8px 40px rgba(124,58,237,0.15), inset 0 -20px 40px rgba(255,255,255,0.25);
    animation: morphIdle 7s ease-in-out infinite, hueIdle 9s ease-in-out infinite alternate;
    transition: background var(--transition), box-shadow var(--transition), width var(--transition), height var(--transition), filter var(--transition);
    will-change: transform, border-radius, filter;
  }
  .orb::before {
    content: ''; position: absolute; top: 18%; left: 22%; width: 30%; height: 20%;
    background: rgba(255,255,255,0.45); border-radius: 50%; filter: blur(10px);
    transform: rotate(-20deg); transition: opacity var(--transition);
  }
  @keyframes morphIdle {
    0%{border-radius:60% 40% 30% 70% / 60% 30% 70% 40%}
    25%{border-radius:40% 60% 55% 45% / 55% 45% 60% 40%}
    50%{border-radius:30% 60% 70% 40% / 50% 60% 30% 60%}
    75%{border-radius:55% 45% 40% 60% / 40% 65% 35% 55%}
    100%{border-radius:60% 40% 30% 70% / 60% 30% 70% 40%}
  }
  @keyframes hueIdle { from{filter:hue-rotate(0deg) saturate(1.1) brightness(1)} to{filter:hue-rotate(18deg) saturate(1.3) brightness(1.04)} }
  .orb.listening {
    width: 200px; height: 200px;
    background: radial-gradient(circle at 38% 36%, var(--listen-3) 0%, var(--listen-1) 45%, var(--listen-2) 100%);
    box-shadow: 0 0 70px rgba(109,40,217,0.40), 0 8px 50px rgba(109,40,217,0.22), inset 0 -20px 40px rgba(255,255,255,0.20);
    animation: morphListening 1.2s ease-in-out infinite, hueListening 5s ease-in-out infinite alternate;
  }
  .halo.listening { background: radial-gradient(circle, var(--listen-1) 0%, transparent 70%); opacity: 0.5; animation: haloListening 1.2s ease-in-out infinite; }
  @keyframes haloListening { 0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(1.30);opacity:.70} }
  @keyframes morphListening {
    0%{border-radius:54% 46% 42% 58% / 52% 44% 56% 48%;transform:scale(1)}
    25%{border-radius:62% 38% 52% 48% / 44% 60% 40% 56%;transform:scale(1.07)}
    50%{border-radius:42% 58% 60% 40% / 58% 42% 58% 42%;transform:scale(1.12)}
    75%{border-radius:58% 42% 44% 56% / 46% 62% 38% 54%;transform:scale(1.07)}
    100%{border-radius:54% 46% 42% 58% / 52% 44% 56% 48%;transform:scale(1)}
  }
  @keyframes hueListening { from{filter:hue-rotate(0deg) saturate(1.6) brightness(1.05)} to{filter:hue-rotate(-20deg) saturate(2.0) brightness(1.08)} }
  .waves { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; }
  .wave { position: absolute; inset: 0; border: 1.5px solid rgba(167,139,250,0.5); border-radius: 50%; opacity: 0; animation: waveOut 2.4s ease-out infinite; }
  .wave:nth-child(2){animation-delay:.8s} .wave:nth-child(3){animation-delay:1.6s}
  @keyframes waveOut { 0%{transform:scale(0.9);opacity:.6}100%{transform:scale(1.7);opacity:0} }
  .waves.hidden .wave { animation-play-state: paused; opacity: 0; }
</style>
</head>
<body>
<div class="scene">
  <div class="halo listening" id="halo"></div>
  <div class="orb listening" id="orb">
    <div class="waves" id="waves">
      <div class="wave"></div><div class="wave"></div><div class="wave"></div>
    </div>
  </div>
</div>
<script>
  const orb=document.getElementById('orb'),halo=document.getElementById('halo'),waves=document.getElementById('waves');
  function setState(s){
    orb.classList.toggle('listening',s==='listening');
    halo.classList.toggle('listening',s==='listening');
    waves.className=s==='listening'?'waves':'waves hidden';
  }
  // gentle auto loop: listen ~5.5s, idle ~3.5s
  let on=true;
  setInterval(()=>{on=!on;setState(on?'listening':'idle');}, 4500);
</script>
</body>
</html>
