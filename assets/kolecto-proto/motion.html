<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kolecto — Motion demo (vraies maquettes)</title>
<style>
:root{
  --indigo:#4038E5;      /* Kolecto accent */
  --indigo-soft:#6B63F0;
  --ink:#141233;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;color:var(--ink);
  background:
    radial-gradient(1200px 720px at 12% -12%, #e7e5ff 0, transparent 55%),
    radial-gradient(1100px 800px at 112% 118%, #dfe7ff 0, transparent 52%),
    radial-gradient(900px 600px at 90% -20%, #f3eafe 0, transparent 50%),
    #ecebf3;
}

#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}

/* the floating product window */
#stage{position:relative;width:1512px;height:874px;flex:0 0 auto;transform-origin:center center;
  border-radius:18px;overflow:hidden;background:#fff;
  box-shadow:0 50px 130px -34px rgba(34,26,90,.5),0 12px 40px -18px rgba(34,26,90,.35),0 0 0 1px rgba(255,255,255,.7);
}

/* fake browser chrome */
#chrome{position:absolute;top:0;left:0;right:0;height:48px;z-index:30;display:flex;align-items:center;gap:16px;
  padding:0 18px;background:linear-gradient(#fbfbfe,#f2f1f8);border-bottom:1px solid rgba(20,18,51,.07)}
#chrome .dots{display:flex;gap:8px}
#chrome .dots i{width:12px;height:12px;border-radius:50%;display:block}
#chrome .dots i:nth-child(1){background:#ff5f57}
#chrome .dots i:nth-child(2){background:#febc2e}
#chrome .dots i:nth-child(3){background:#28c840}
#urlbar{flex:1;max-width:560px;margin:0 auto;height:30px;border-radius:8px;background:#fff;
  border:1px solid rgba(20,18,51,.09);display:flex;align-items:center;gap:8px;padding:0 12px;
  font-size:13px;color:#6a6a86;box-shadow:inset 0 1px 2px rgba(20,18,51,.04)}
#urlbar svg{width:13px;height:13px;flex:0 0 auto;opacity:.7}
#urlbar .u{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#urlbar .u b{color:var(--ink);font-weight:600}
#chrome .spark{width:60px;flex:0 0 auto}

/* screen (below chrome) */
#screen{position:absolute;top:48px;left:0;right:0;bottom:0;overflow:hidden;background:#fafafa}

/* frames (crossfade + gentle zoom-in reveal) */
.frame{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .55s ease,visibility .55s;z-index:1}
.frame.active{opacity:1;visibility:visible;z-index:2}
.frame img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;
  transform:scale(1.045);transition:transform 3.2s cubic-bezier(.2,.6,.2,1)}
.frame.active img{transform:scale(1)}

/* moving cursor (coords are in screen space) */
#cursor{position:absolute;left:0;top:0;z-index:40;pointer-events:none;opacity:0;
  transition:left .95s cubic-bezier(.45,.05,.2,1),top .95s cubic-bezier(.45,.05,.2,1),opacity .35s;
  filter:drop-shadow(0 5px 8px rgba(20,16,60,.4))}
#cursor.show{opacity:1}
#cursor .arw{width:30px;height:30px;display:block}
#cursor .rip{position:absolute;left:4px;top:3px;width:18px;height:18px;border-radius:50%;
  background:rgba(64,56,229,.5);transform:scale(0);opacity:0}
#cursor.click .rip{animation:rip .6s ease-out}
@keyframes rip{0%{transform:scale(0);opacity:.75}100%{transform:scale(5.5);opacity:0}}
#cursor.press .arw{transform:scale(.82);transition:transform .12s}

/* caption + controller */
#cap{position:fixed;left:22px;bottom:24px;z-index:50;background:rgba(20,18,45,.85);backdrop-filter:blur(12px);
  color:#fff;font-size:13px;padding:10px 15px;border-radius:13px;max-width:280px;line-height:1.45;
  box-shadow:0 12px 34px rgba(20,16,60,.32);opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s}
#cap.on{opacity:1;transform:translateY(0)}
#cap b{color:#bcb6ff;font-weight:600}
@media (max-width:760px){#cap{display:none}}

#ctl{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:6px;
  background:rgba(20,18,45,.85);backdrop-filter:blur(12px);border-radius:999px;padding:7px 8px;
  box-shadow:0 12px 34px rgba(20,16,60,.32);color:#fff;font-size:13px}
#ctl button{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;border:none;background:none;cursor:pointer}
#ctl button:hover{background:rgba(255,255,255,.14)}
#ctl button svg{width:16px;height:16px}
#ctl .steplabel{padding:0 8px;min-width:184px;text-align:center;font-weight:500;opacity:.95}
#ctl .dots{display:flex;gap:5px;padding:0 6px}
#ctl .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.28);transition:background .3s,width .3s}
#ctl .dots i.on{background:#fff}
#ctl .dots i.cur{width:16px;border-radius:3px;background:var(--indigo-soft)}
</style>
</head>
<body>
<div id="viewport"><div id="stage">

  <div id="chrome">
    <div class="dots"><i></i><i></i><i></i></div>
    <div id="urlbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span class="u"><b>app.kolecto.co</b><span id="path">/accueil</span></span>
    </div>
    <span class="spark"></span>
  </div>

  <div id="screen">
    <div class="frame" data-key="home"><img src="frames/home.png" alt="Kolecto — Accueil"></div>
    <div class="frame" data-key="create"><img src="frames/invoice-create.png" alt="Kolecto — Création de facture"></div>
    <div class="frame" data-key="invoices"><img src="frames/invoices.png" alt="Kolecto — Mes factures"></div>
    <div class="frame" data-key="purchases"><img src="frames/purchases.png" alt="Kolecto — Dépenses fournisseurs"></div>
    <div class="frame" data-key="einvoicing"><img src="frames/einvoicing.png" alt="Kolecto — Facturation électronique"></div>
    <div class="frame" data-key="accounting"><img src="frames/accounting.png" alt="Kolecto — Plan comptable"></div>
  </div>

</div></div>

<div id="cap"></div>
<div id="ctl">
  <button id="btnPlay" title="Lecture / Pause"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
  <button id="btnPrev" title="Précédent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
  <span class="steplabel" id="stepLabel">1 / 6 · Accueil</span>
  <div class="dots" id="dots"></div>
  <button id="btnNext" title="Suivant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
  <button id="btnRestart" title="Recommencer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v6h6M20 20v-6h-6"/><path d="M20 10a8 8 0 0 0-14-4M4 14a8 8 0 0 0 14 4"/></svg></button>
</div>

<script>
/* ---- scale to fit ---- */
var stage=document.getElementById('stage');
var STAGE_W=1512, STAGE_H=874;
function fit(){
  var pad=56, vw=window.innerWidth-pad, vh=window.innerHeight-pad-72;
  var s=Math.min(vw/STAGE_W, vh/STAGE_H);
  if(!isFinite(s)||s<=0) s=0.2;
  stage.style.transform='scale('+Math.max(0.2,s)+')';
}
window.addEventListener('resize',fit); fit();

/* ---- frames ---- */
var frames={};
document.querySelectorAll('.frame').forEach(function(f){frames[f.dataset.key]=f});
var pathEl=document.getElementById('path');

/* ordered steps: screen + label + url path + caption */
var STEPS=[
  {key:'home',       label:'Accueil',               path:'/accueil',
   cap:"L'<b>accueil</b> — trésorerie, ventes & achats en un coup d'œil"},
  {key:'create',     label:'Création de facture',   path:'/ventes/factures/nouvelle',
   cap:"<b>Création de facture</b> — aperçu du document en direct"},
  {key:'invoices',   label:'Mes factures',          path:'/ventes/factures',
   cap:"Toutes les <b>factures</b> — statuts, montants, relances"},
  {key:'purchases',  label:'Dépenses fournisseurs', path:'/achats/factures',
   cap:"<b>Dépenses fournisseurs</b> — collecte & import automatiques"},
  {key:'einvoicing', label:'Facturation électronique', path:'/facturation-electronique',
   cap:"<b>Facturation électronique</b> — la réforme 2026, clé en main"},
  {key:'accounting', label:'Comptabilité',          path:'/comptabilite/plan-comptable',
   cap:"<b>Comptabilité</b> — plan comptable & export FEC"}
];
var idx=0, playing=false, token=0;

function show(key){
  Object.keys(frames).forEach(function(k){frames[k].classList.toggle('active', k===key)});
}
function setControls(i){
  document.getElementById('stepLabel').textContent=(i+1)+' / '+STEPS.length+' · '+STEPS[i].label;
  pathEl.textContent=STEPS[i].path;
  var d=document.getElementById('dots'); d.innerHTML='';
  STEPS.forEach(function(_,k){var e=document.createElement('i'); if(k<i)e.className='on'; if(k===i)e.className='cur'; d.appendChild(e)});
}
function goTo(i){ i=Math.max(0,Math.min(STEPS.length-1,i)); idx=i; show(STEPS[i].key); setControls(i); }

/* ---- cursor (child of #screen → screen-space coords) ---- */
var screenEl=document.getElementById('screen');
var cursor=document.createElement('div');
cursor.id='cursor';
cursor.innerHTML='<svg class="arw" viewBox="0 0 24 24" fill="#fff" stroke="#241d47" stroke-width="1.3" stroke-linejoin="round"><path d="M5 3l14.5 8.6-6.3 1.4L9.6 20 5 3z"/></svg><span class="rip"></span>';
screenEl.appendChild(cursor);
function moveCursor(x,y){cursor.style.left=x+'px';cursor.style.top=y+'px';}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)});}
var capEl=document.getElementById('cap');
function cap(html){ if(!html){capEl.classList.remove('on');return;} capEl.innerHTML=html; capEl.classList.add('on'); }
function updatePlay(){document.getElementById('btnPlay').innerHTML=playing
  ?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'
  :'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';}

async function clickAt(x,y,hold){
  moveCursor(x,y);
  await sleep(1000);
  cursor.classList.add('click','press');
  await sleep(150); cursor.classList.remove('press');
  setTimeout(function(){cursor.classList.remove('click')},600);
  await sleep(hold||420);
}

function pause(){ if(!playing)return; playing=false; token++; cursor.classList.remove('show'); updatePlay(); cap(''); }

async function tour(){
  var my=++token; playing=true; updatePlay();
  cursor.classList.add('show');
  var A=function(){return my===token && playing};
  while(A()){
    // 1 ACCUEIL → on va créer une facture
    goTo(0); cap(STEPS[0].cap); moveCursor(420,300);
    await sleep(1500); if(!A())break;
    await clickAt(875,720); if(!A())break;   // "Créer une facture"

    // 2 CRÉATION DE FACTURE → on parcourt puis on valide
    goTo(1); cap(STEPS[1].cap);
    await sleep(900); if(!A())break;
    moveCursor(377,241);                       // champ "Sélectionner un client"
    await sleep(1300); if(!A())break;
    moveCursor(351,358);                        // produit/service
    await sleep(1200); if(!A())break;
    await clickAt(1358,30,300); if(!A())break;  // "Valider la facture"

    // 3 MES FACTURES → on ouvre les achats
    goTo(2); cap(STEPS[2].cap);
    await sleep(2600); if(!A())break;
    await clickAt(84,452); if(!A())break;       // nav Achats › Factures

    // 4 DÉPENSES FOURNISSEURS (empty) → facturation électronique
    goTo(3); cap(STEPS[3].cap);
    await sleep(2300); if(!A())break;
    await clickAt(129,757); if(!A())break;      // nav Facturation électronique

    // 5 FACTURATION ÉLECTRONIQUE → comptabilité
    goTo(4); cap(STEPS[4].cap);
    await sleep(3000); if(!A())break;
    await clickAt(93,618); if(!A())break;       // nav Comptabilité

    // 6 PLAN COMPTABLE (empty) → fin, on laisse respirer puis on reboucle
    goTo(5); cap(STEPS[5].cap);
    cursor.classList.remove('show');
    await sleep(4200); if(!A())break;
    cursor.classList.add('show');
  }
}

/* ---- controls ---- */
document.getElementById('btnPlay').addEventListener('click',function(){ playing?pause():tour(); });
document.getElementById('btnNext').addEventListener('click',function(){ pause(); goTo(idx+1); });
document.getElementById('btnPrev').addEventListener('click',function(){ pause(); goTo(idx-1); });
document.getElementById('btnRestart').addEventListener('click',function(){ pause(); goTo(0); });
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){pause();goTo(idx+1);}
  if(e.key==='ArrowLeft'){pause();goTo(idx-1);}
  if(e.key===' '){e.preventDefault();document.getElementById('btnPlay').click();}
});
/* a real click hands control back to the user */
document.addEventListener('click',function(e){
  if(e.isTrusted && playing && !e.target.closest('#ctl')) pause();
},true);

/* ---- start ---- */
goTo(0);
if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ updatePlay(); }
else { tour(); }
</script>
</body>
</html>
