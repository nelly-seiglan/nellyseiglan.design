<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rose — Motion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:transparent;display:grid;place-items:center}
/* full-frame motion block — fills its container, rounded, no chrome, no controls */
.motion{
  width:100%;
  aspect-ratio:16/9;
  border-radius:18px;
  overflow:hidden;
  background:#0b1020;
  box-shadow:0 40px 100px -40px rgba(24,34,74,.45);
}
.motion video{
  width:100%;height:100%;
  object-fit:cover;
  object-position:top center;
  display:block;
}
</style>
</head>
<body>
  <div class="motion">
    <video src="../rose.mp4" autoplay muted loop playsinline preload="auto"></video>
  </div>
<script>
/* make sure it plays even if the browser is picky about autoplay */
(function(){
  var v=document.querySelector('.motion video');
  function go(){ var p=v.play(); if(p&&p.catch) p.catch(function(){}); }
  go();
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) go(); });
})();
</script>
</body>
</html>
