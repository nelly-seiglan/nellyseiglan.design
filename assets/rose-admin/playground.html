document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tyle=\"position:relative; width:46px; height:46px; flex-shrink:0;\">\n          <div style=\"{{ ringStyle }}\"><\u002Fdiv>\n          <div style=\"position:absolute; inset:5px; border-radius:50%; background:var(--card); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;\">{{ readyPct }}%<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1; min-width:0;\">\n          <div style=\"font-weight:600; font-size:15px; color:var(--foreground);\">{{ widgetTitle }}<\u002Fdiv>\n          <div style=\"font-size:12px; color:var(--muted-foreground); margin-top:2px;\">{{ readyDone }} of {{ readyTotal }} steps done<\u002Fdiv>\n        <\u002Fdiv>\n        <button onclick=\"{{ collapseWidget }}\" style=\"width:28px; height:28px; border:none; border-radius:7px; background:transparent; color:var(--foreground-subtle); cursor:pointer; display:flex; align-items:center; justify-content:center;\" style-hover=\"background:var(--state-hover);\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" strokewidth=\"2\" strokelinecap=\"round\" strokelinejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"flex:1; overflow-y:auto; padding:10px 12px 14px;\">\n        <sc-for list=\"{{ steps }}\" as=\"it\" hint-placeholder-count=\"6\">\n          <button onclick=\"{{ it.onClick }}\" style=\"{{ it.rowStyle }}\">\n            <span style=\"{{ it.dotStyle }}\">{{ it.dotInner }}<\u002Fspan>\n            <span style=\"flex:1; text-align:left; font-size:13px; font-weight:{{ it.labelWeight }}; color:{{ it.labelColor }};\">{{ it.label }}<\u002Fspan>\n            <span style=\"{{ it.tagStyle }}\">{{ it.tag }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- toast -->\n  <sc-if value=\"{{ toastShow }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; bottom:24px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:10px; padding:12px 18px; background:var(--foreground); color:var(--primary-foreground); border-radius:10px; box-shadow:0 12px 32px rgba(15,23,36,0.24); font-size:13px; font-weight:500; z-index:70; animation:rose-fade .16s ease;\">\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--green-500)\" strokewidth=\"2.4\" strokelinecap=\"round\" strokelinejoin=\"round\"><path d=\"M20 6 9 17l-4-4\"><\u002Fpath><\u002Fsvg>\n      {{ toastText }}\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.inputRef = React.createRef();\n    this.fixRef = React.createRef();\n    this.scrollRef = React.createRef();\n    this.state = {\n      mode: \"chat\",\n      messages: [],\n      benchOpen: true,\n      widgetOpen: false,\n      pagesLoaded: 178,\n      pagesTotal: 210,\n      steps: { brand: \"done\", knowledge: \"progress\", starter: \"todo\", appearance: \"todo\", cta: \"todo\", test: \"todo\", install: \"todo\" },\n      review: [\n        { id: 1, cat: \"Pricing\", q: \"How much does Rose cost?\", answer: \"Rose is priced per website based on your monthly traffic and the agents you turn on. Plans start with a free trial.\", unsure: true, status: \"pending\" },\n        { id: 2, cat: \"Getting started\", q: \"How long does it take to get Rose live?\", answer: \"Most teams are live in under a day — you paste one snippet onto your site and Rose starts answering right away.\", unsure: false, status: \"pending\" },\n        { id: 3, cat: \"Integrations\", q: \"Do you connect with HubSpot and Salesforce?\", answer: \"Yes. Rose pushes qualified leads into HubSpot and Salesforce with the full conversation context.\", unsure: false, status: \"pending\" },\n        { id: 4, cat: \"Product\", q: \"How is Rose different from a normal chatbot?\", answer: \"Rose reads your entire site and answers in your brand voice — it qualifies buyers and routes hot accounts to sales, instead of following scripted flows.\", unsure: false, status: \"pending\" },\n        { id: 5, cat: \"Trust\", q: \"Are you SOC 2 compliant and GDPR-ready?\", answer: \"I don't have confirmed details on our security certifications yet.\", unsure: true, status: \"pending\" },\n        { id: 6, cat: \"Demo\", q: \"Can I book a demo?\", answer: \"Absolutely — I can set up a 20-minute demo with the team. Want me to find a time?\", unsure: false, status: \"pending\" },\n      ],\n      menuId: null,\n      fixId: null,\n      toast: null,\n    };\n    this._tag = {\n      \"Pricing\": [\"--tag-green-bg\", \"--tag-green-fg\"],\n      \"Getting started\": [\"--tag-blue-bg\", \"--tag-blue-fg\"],\n      \"Integrations\": [\"--tag-teal-bg\", \"--tag-teal-fg\"],\n      \"Product\": [\"--tag-violet-bg\", \"--tag-violet-fg\"],\n      \"Trust\": [\"--tag-amber-bg\", \"--tag-amber-fg\"],\n      \"Demo\": [\"--tag-coral-bg\", \"--tag-coral-fg\"],\n    };\n    this.meta = {\n      brand: { label: \"Brand & tone\", view: \"brand\" },\n      knowledge: { label: \"Website knowledge\", view: \"knowledge\" },\n      starter: { label: \"Suggested questions\", view: \"starter\" },\n      appearance: { label: \"Widget appearance\", view: \"appearance\" },\n      cta: { label: \"Where to send buyers\", view: \"cta\" },\n      test: { label: \"Test your agent\", view: \"__playground\" },\n      install: { label: \"Deploy & publish\", view: \"install\" },\n    };\n    this.essentialOrder = [\"brand\", \"knowledge\", \"starter\", \"cta\", \"test\", \"install\"];\n  }\n\n  componentDidMount() {\n    try { if (localStorage.getItem(\"rose_tested\") === \"1\") this.setState((s) => ({ steps: { ...s.steps, test: \"done\" } })); } catch (e) {}\n    this.loadTimer = setInterval(() => {\n      this.setState((s) => {\n        if (s.pagesLoaded >= s.pagesTotal) { clearInterval(this.loadTimer); return { pagesLoaded: s.pagesTotal, steps: { ...s.steps, knowledge: \"done\" } }; }\n        return { pagesLoaded: Math.min(s.pagesTotal, s.pagesLoaded + 3) };\n      });\n    }, 1600);\n  }\n  componentDidUpdate() {\n    if (this.scrollRef.current) this.scrollRef.current.scrollTop = this.scrollRef.current.scrollHeight;\n  }\n  componentWillUnmount() { clearInterval(this.loadTimer); clearInterval(this.streamTimer); clearTimeout(this.toastTimer); }\n\n  flash(text) { clearTimeout(this.toastTimer); this.setState({ toast: text }); this.toastTimer = setTimeout(() => this.setState({ toast: null }), 2600); }\n\n  answerFor(q) {\n    const t = q.toLowerCase();\n    if (/(price|pricing|cost|how much|expensive)/.test(t)) return \"Rose is priced per website, based on your monthly traffic and the agents you turn on. Plans start with a free trial — no card needed. I can send exact pricing or connect you with the team.\";\n    if (/(implement|install|long|setup|set up|get live|live)/.test(t)) return \"Most teams are live in under a day. You paste a short snippet onto your site (or via Google Tag Manager) and Rose starts answering — it's already read your website.\";\n    if (/(integrat|hubspot|salesforce|crm)/.test(t)) return \"Yes — Rose hands qualified leads to HubSpot and Salesforce with the full conversation context, so your team picks up right where the chat left off.\";\n    if (/(different|chatbot|vs|compare|better)/.test(t)) return \"Unlike a scripted chatbot, Rose reads your whole website and answers in your brand voice. It qualifies buyers, books demos and routes hot accounts to sales — a rep, not an FAQ.\";\n    if (/(demo|book|meeting|call|trial)/.test(t)) return \"Happy to — I can book you a 20-minute demo with the team. Want me to grab a time that works?\";\n    if (/(secure|security|soc|gdpr|data|privacy|compliant)/.test(t)) return \"I'm still learning the details on our security certifications — the team can confirm SOC 2 and GDPR specifics. Want me to connect you?\";\n    return \"Good question. Based on what I've read on your site so far, here's what I can share — and I'm still loading more pages, so this will keep getting sharper.\";\n  }\n\n  send(text) {\n    const q = (text || \"\").trim();\n    if (!q) return;\n    try { localStorage.setItem(\"rose_tested\", \"1\"); } catch (e) {}\n    if (this.state.steps.test !== \"done\") this.setState((s) => ({ steps: { ...s.steps, test: \"done\" } }));\n    if (this.inputRef.current) this.inputRef.current.value = \"\";\n    clearInterval(this.streamTimer);\n    const full = this.answerFor(q);\n    this.setState((s) => ({ messages: [...s.messages, { role: \"user\", text: q, typing: false }, { role: \"assistant\", text: \"\", typing: true }] }));\n    setTimeout(() => {\n      const words = full.split(\" \");\n      let i = 0;\n      this.streamTimer = setInterval(() => {\n        i += 2;\n        const done = i >= words.length;\n        this.setState((s) => {\n          const msgs = s.messages.slice();\n          msgs[msgs.length - 1] = { role: \"assistant\", text: done ? full : words.slice(0, i).join(\" \"), typing: false };\n          return { messages: msgs };\n        });\n        if (done) clearInterval(this.streamTimer);\n      }, 55);\n    }, 550);\n  }\n\n  verdict(id, v, note) {\n    this.setState((s) => ({ review: s.review.map((r) => (r.id === id ? { ...r, status: v, note } : r)), menuId: null, fixId: v === \"fixed\" ? null : s.fixId }));\n    if (v === \"good\") this.flash(\"Marked good — Rose keeps this answer.\");\n  }\n  applyFix(id) { const val = this.fixRef.current ? this.fixRef.current.value.trim() : \"\"; this.verdict(id, \"fixed\", val); this.flash(\"Rose updated the answer.\"); }\n\n  renderVals() {\n    const s = this.state;\n    const isChat = s.mode === \"chat\";\n    const P = (d) => React.createElement(\"path\", { d, key: d });\n    const tab = (active) => ({ display: \"inline-flex\", alignItems: \"center\", justifyContent: \"center\", width: \"100%\", gap: 7, padding: \"9px 14px\", borderRadius: 7, border: \"none\", cursor: \"pointer\", fontFamily: \"'DM Sans',sans-serif\", fontWeight: 500, fontSize: 13, whiteSpace: \"nowrap\", background: active ? \"var(--card)\" : \"transparent\", color: active ? \"var(--foreground)\" : \"var(--muted-foreground)\", boxShadow: active ? \"0 1px 2px rgba(15,23,36,0.08)\" : \"none\" });\n\n    // on-site bar chat\n    const messages = s.messages.map((m) => {\n      const isUser = m.role === \"user\";\n      return { typing: !!m.typing, showText: !m.typing, text: m.text,\n        rowStyle: { display: \"flex\", justifyContent: isUser ? \"flex-end\" : \"flex-start\" },\n        bubbleStyle: isUser\n          ? { maxWidth: \"80%\", borderRadius: 16, padding: \"10px 15px\", boxSizing: \"border-box\", background: \"var(--brand-50)\" }\n          : { maxWidth: \"100%\", borderRadius: 0, padding: \"0\", boxSizing: \"border-box\", background: \"transparent\" },\n        textStyle: { fontSize: 15, lineHeight: 1.6, color: \"var(--foreground)\", whiteSpace: \"pre-wrap\" } };\n    });\n    const hasConvo = s.messages.length > 0;\n    const chipDefs = [\"How long does it take to implement Rose?\", \"Do you integrate with my CRM?\", \"How much does Rose cost?\", \"Can I book a demo?\"];\n    const chips = chipDefs.slice(0, 2).map((t) => ({ text: t, onClick: () => this.send(t) }));\n    const showChips = !hasConvo;\n\n    // topic tests\n    const topicDefs = [\n      [\"Pricing\", \"How much does Rose cost?\"],\n      [\"Integrations\", \"Do you integrate with HubSpot and Salesforce?\"],\n      [\"Security\", \"Are you SOC 2 compliant and GDPR-ready?\"],\n      [\"Getting started\", \"How long does it take to get Rose live?\"],\n      [\"Product\", \"How is Rose different from a normal chatbot?\"],\n      [\"Demo\", \"Can I book a demo?\"],\n    ];\n    const topics = topicDefs.map((t) => ({ label: t[0], onClick: () => this.send(t[1]),\n      style: { padding: \"7px 12px\", borderRadius: 9999, border: \"none\", boxShadow: \"inset 0 0 0 1px var(--border)\", background: \"var(--card)\", color: \"var(--foreground)\", fontFamily: \"'DM Sans',sans-serif\", fontWeight: 500, fontSize: 12.5, cursor: \"pointer\", whiteSpace: \"nowrap\" } }));\n\n    // review\n    const reviewTotal = s.review.length;\n    const reviewedCount = s.review.filter((r) => r.status !== \"pending\").length;\n    const reviewPct = Math.round((reviewedCount / reviewTotal) * 100);\n    const chip = (bg, fg) => ({ display: \"inline-flex\", alignItems: \"center\", gap: 5, padding: \"4px 10px\", borderRadius: 9999, background: bg, color: fg, fontWeight: 600, fontSize: 11 });\n    const reviewCards = s.review.map((r) => {\n      const resolved = r.status !== \"pending\";\n      const [bgv, fgv] = this._tag[r.cat] || [\"--tag-gray-bg\", \"--tag-gray-fg\"];\n      let resolvedLabel = \"\", resStyle = {};\n      if (r.status === \"good\") { resolvedLabel = \"Marked good\"; resStyle = chip(\"var(--success-subtle)\", \"var(--tag-green-fg)\"); }\n      else if (r.status === \"fixed\") { resolvedLabel = \"Fix applied\"; resStyle = chip(\"var(--brand-100)\", \"var(--brand-700)\"); }\n      else if (r.status && r.status.indexOf(\"wrong:\") === 0) { resolvedLabel = \"Flagged → \" + r.note; resStyle = chip(\"var(--tag-coral-bg)\", \"var(--tag-coral-fg)\"); }\n      const vbtn = () => ({ display: \"inline-flex\", alignItems: \"center\", gap: 7, padding: \"8px 13px\", borderRadius: 8, border: \"none\", cursor: \"pointer\", fontFamily: \"'DM Sans',sans-serif\", fontWeight: 500, fontSize: 13, background: \"var(--card)\", boxShadow: \"inset 0 0 0 1px var(--border)\", color: \"var(--foreground-secondary)\" });\n      const routes = [\n        { label: \"The facts are wrong\", dest: \"Knowledge\", onClick: () => this.verdict(r.id, \"wrong:\", \"Knowledge\") },\n        { label: \"Wrong tone or behavior\", dest: \"Brand & tone\", onClick: () => this.verdict(r.id, \"wrong:\", \"Brand & tone\") },\n        { label: \"The pricing is off\", dest: \"Knowledge\", onClick: () => this.verdict(r.id, \"wrong:\", \"Pricing\") },\n      ];\n      return {\n        q: r.q, answer: r.answer, cat: r.cat, unsure: r.unsure, resolved,\n        cardStyle: { border: \"1px solid var(--border)\", borderRadius: 12, padding: 16, background: resolved ? \"var(--neutral-50)\" : \"var(--card)\", opacity: resolved ? 0.92 : 1 },\n        tagStyle: chip(\"var(--\" + bgv.slice(2) + \")\", \"var(--\" + fgv.slice(2) + \")\"),\n        resolvedLabel, resolvedStyle: resStyle,\n        goodStyle: r.status === \"good\" ? { ...vbtn(), background: \"var(--success-subtle)\", boxShadow: \"inset 0 0 0 1px var(--success)\", color: \"var(--tag-green-fg)\" } : vbtn(),\n        wrongStyle: (r.status && r.status.indexOf(\"wrong:\") === 0) ? { ...vbtn(), background: \"var(--tag-coral-bg)\", boxShadow: \"inset 0 0 0 1px var(--tag-coral-fg)\", color: \"var(--tag-coral-fg)\" } : vbtn(),\n        fixBtnStyle: r.status === \"fixed\" ? { ...vbtn(), background: \"var(--brand-100)\", boxShadow: \"inset 0 0 0 1px var(--brand-600)\", color: \"var(--brand-700)\" } : vbtn(),\n        onGood: () => this.verdict(r.id, \"good\"),\n        onWrongToggle: () => this.setState((st) => ({ menuId: st.menuId === r.id ? null : r.id, fixId: null })),\n        onFixToggle: () => this.setState((st) => ({ fixId: st.fixId === r.id ? null : r.id, menuId: null })),\n        onApplyFix: () => this.applyFix(r.id),\n        menuOpen: s.menuId === r.id, fixOpen: s.fixId === r.id, routes,\n      };\n    });\n\n    // widget\n    const order = this.essentialOrder;\n    const readyTotal = order.length;\n    const readyDone = order.filter((k) => s.steps[k] === \"done\").length;\n    const pct = Math.round((readyDone / readyTotal) * 100);\n    const firstTodo = order.find((k) => s.steps[k] !== \"done\");\n    const nextLabel = firstTodo ? this.meta[firstTodo].label : \"Publish\";\n    const check = React.createElement(\"span\", { style:
